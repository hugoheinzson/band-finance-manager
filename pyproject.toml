[project]
name = "band-manager"
version = "0.1.0"
description = "Band finance manager – gig budgets and musician payouts as a PWA + MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastmcp>=4.0.3,<5",
    "pydantic>=2.7",
    "openpyxl>=3.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
